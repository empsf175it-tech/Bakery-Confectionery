<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F8FAF8"/>
      <stop offset="100%" stop-color="#E6EBE6"/>
    </radialGradient>
    <linearGradient id="cakeStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D8"/>
      <stop offset="50%" stop-color="#D8C2AC"/>
      <stop offset="100%" stop-color="#B89F88"/>
    </linearGradient>
    <linearGradient id="cakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C4B40"/>
      <stop offset="50%" stop-color="#4A3B32"/>
      <stop offset="100%" stop-color="#362A23"/>
    </linearGradient>
    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B1A14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Cake Stand Base & Plate -->
  <g filter="url(#softDrop)">
    <ellipse cx="300" cy="495" rx="145" ry="24" fill="#B89F88" opacity="0.35"/>
    <path d="M260 470 L340 470 L350 515 L250 515 Z" fill="url(#cakeStand)"/>
    <ellipse cx="300" cy="470" rx="205" ry="32" fill="url(#cakeStand)"/>
    <ellipse cx="300" cy="466" rx="196" ry="28" fill="#FFFDF9"/>
  </g>

  <!-- Architectural Square Cake Body -->
  <g filter="url(#softDrop)">
    <path d="M160 270 L440 270 L440 430 L160 430 Z" fill="url(#cakeBody)"/>
    <polygon points="160,270 300,220 440,270 300,320" fill="#5C4B40"/>
    <polygon points="440,270 440,430 300,470 300,320" fill="#362A23"/>
    <polygon points="160,270 300,320 300,470 160,430" fill="#4A3B32"/>
  </g>

  <!-- Decadent Toppings -->
  <g transform="translate(300, 255)">
    <!-- French Macarons -->
    <g transform="translate(-45, -20)">
      <ellipse cx="0" cy="0" rx="26" ry="13" fill="#7A685A"/>
      <rect x="-24" y="-2" width="48" height="5" rx="2.5" fill="#FAF5EC"/>
      <ellipse cx="0" cy="-5" rx="25" ry="12" fill="#948071"/>
    </g>
    <g transform="translate(45, -15)">
      <ellipse cx="0" cy="0" rx="26" ry="13" fill="#7A685A"/>
      <rect x="-24" y="-2" width="48" height="5" rx="2.5" fill="#FAF5EC"/>
      <ellipse cx="0" cy="-5" rx="25" ry="12" fill="#948071"/>
    </g>

    <!-- 24K Gold Flakes -->
    <path d="M-85 10 L-72 -5 L-65 12 Z" fill="#C98B4B"/>
    <path d="M-10 -38 L8 -32 L0 -18 Z" fill="#C98B4B"/>
    <path d="M75 5 L90 18 L78 26 Z" fill="#C98B4B"/>

    <!-- Fresh Raspberries -->
    <circle cx="-15" cy="-15" r="14" fill="#C72C41"/>
    <circle cx="12" cy="-22" r="15" fill="#9E1B32"/>
    <circle cx="0" cy="-5" r="16" fill="#D9384E"/>
  </g>

  <!-- Studio Identity Label Badge -->
  <g transform="translate(300, 545)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(43,26,20,0.88)" stroke="#C98B4B" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#C98B4B" text-anchor="middle" letter-spacing="1.8">ARCHITECTURAL SQUARE</text>
  </g>
</svg>

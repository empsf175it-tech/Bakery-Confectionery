<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Golden Amber Brand Gradient -->
    <linearGradient id="favBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0B359" />
      <stop offset="52%" stop-color="#C98B4B" />
      <stop offset="100%" stop-color="#9B5D22" />
    </linearGradient>

    <!-- Crisp White-to-Cream Mark Gradient -->
    <linearGradient id="favMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF5E5" />
    </linearGradient>

    <!-- Warm Gold Confection Glow Accent -->
    <linearGradient id="favMarkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE2A8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="favDropShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2B1A14" flood-opacity="0.32" />
    </filter>

    <!-- Radial Gloss Light Sheen -->
    <radialGradient id="favGloss" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Gold Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#favBgGradient)" />

  <!-- Glass Gloss Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#favGloss)" />

  <!-- Inner Rim Border -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" fill="none" stroke="rgba(255, 255, 255, 0.42)" stroke-width="1.5" />

  <!-- Brand Mark Whisk & Cloche (Centered and Crisp) -->
  <g transform="translate(13, 13) scale(1.1875)" filter="url(#favDropShadow)">
    <!-- Base Cloche Pedestal Shelf -->
    <path d="M5.5 23.5H26.5" stroke="url(#favMarkGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Outer Patisserie Cloche / Dome Arch -->
    <path d="M7 23.5C7 14.5 10.8 8.5 16 8.5C21.2 8.5 25 14.5 25 23.5" stroke="url(#favMarkGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Center Whisk Spine Wire -->
    <path d="M16 9V20.5" stroke="url(#favMarkGrad)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Outer Whisk Balloon Loops -->
    <path d="M16 9C12.8 9 10.8 12.8 10.8 16.5C10.8 19.2 13 21 16 21.8" stroke="url(#favMarkGrad)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M16 9C19.2 9 21.2 12.8 21.2 16.5C21.2 19.2 19 21 16 21.8" stroke="url(#favMarkGrad)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Inner Delicate Whisk Teardrop Loops -->
    <path d="M16 11.5C14.2 11.5 13.2 13.8 13.2 16.2C13.2 18 14.4 19.2 16 19.8" stroke="url(#favMarkGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M16 11.5C17.8 11.5 18.8 13.8 18.8 16.2C18.8 18 17.6 19.2 16 19.8" stroke="url(#favMarkGrad)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Whisk Ferrule Collar & Handle -->
    <path d="M13.5 22.8H18.5" stroke="url(#favMarkGrad)" stroke-width="2.0" stroke-linecap="round" />
    <path d="M16 22.8V25.2" stroke="url(#favMarkGrad)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="16" cy="26" r="1.2" fill="url(#favMarkGrad)" />

    <!-- Haute Confection Diamond Star at Crown -->
    <path d="M16 2.0L16.9 4.4L19.3 5.3L16.9 6.2L16 8.6L15.1 6.2L12.7 5.3L15.1 4.4Z" fill="url(#favMarkAccent)" />

    <!-- Micro Confection Accent Sparkle Stars -->
    <circle cx="8.5" cy="11.5" r="1.0" fill="url(#favMarkAccent)" opacity="0.9" />
    <circle cx="23.5" cy="11.5" r="1.0" fill="url(#favMarkAccent)" opacity="0.9" />
  </g>
</svg>

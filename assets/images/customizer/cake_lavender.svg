<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF5FC"/>
      <stop offset="100%" stop-color="#EAE0F0"/>
    </radialGradient>
    <linearGradient id="cakeStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D8"/>
      <stop offset="50%" stop-color="#D8C2AC"/>
      <stop offset="100%" stop-color="#B89F88"/>
    </linearGradient>
    <linearGradient id="cakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C0E8"/>
      <stop offset="50%" stop-color="#CBB5E2"/>
      <stop offset="100%" stop-color="#9C7EB8"/>
    </linearGradient>
    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B1A14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Cake Stand Base & Plate -->
  <g filter="url(#softDrop)">
    <ellipse cx="300" cy="495" rx="145" ry="24" fill="#B89F88" opacity="0.35"/>
    <path d="M260 470 L340 470 L350 515 L250 515 Z" fill="url(#cakeStand)"/>
    <ellipse cx="300" cy="470" rx="205" ry="32" fill="url(#cakeStand)"/>
    <ellipse cx="300" cy="466" rx="196" ry="28" fill="#FFFDF9"/>
  </g>

  <!-- Classic Round Cake Body -->
  <g filter="url(#softDrop)">
    <path d="M140 270 L140 430 C140 468, 460 468, 460 430 L460 270 Z" fill="url(#cakeBody)"/>
    <ellipse cx="300" cy="270" rx="160" ry="42" fill="url(#cakeBody)"/>
    <ellipse cx="300" cy="266" rx="156" ry="40" fill="#D4C0E8"/>
    
    <!-- Smooth Cream Drips -->
    <path d="M140 270 
             Q 165 325 185 280 
             Q 215 345 235 278 
             Q 265 355 295 282 
             Q 335 365 365 278 
             Q 395 335 425 282 
             Q 445 320 460 270 
             C 460 305, 140 305, 140 270 Z" fill="#FAF4FF" opacity="0.92"/>
  </g>

  <!-- Decadent Toppings -->
  <g transform="translate(300, 255)">
    <!-- French Macarons -->
    <g transform="translate(-45, -20)">
      <ellipse cx="0" cy="0" rx="26" ry="13" fill="#B091D1"/>
      <rect x="-24" y="-2" width="48" height="5" rx="2.5" fill="#FAF4FF"/>
      <ellipse cx="0" cy="-5" rx="25" ry="12" fill="#C4A8E3"/>
    </g>
    <g transform="translate(45, -15)">
      <ellipse cx="0" cy="0" rx="26" ry="13" fill="#B091D1"/>
      <rect x="-24" y="-2" width="48" height="5" rx="2.5" fill="#FAF4FF"/>
      <ellipse cx="0" cy="-5" rx="25" ry="12" fill="#C4A8E3"/>
    </g>

    <!-- 24K Gold Flakes -->
    <path d="M-85 10 L-72 -5 L-65 12 Z" fill="#F0C059"/>
    <path d="M-10 -38 L8 -32 L0 -18 Z" fill="#F0C059"/>
    <path d="M75 5 L90 18 L78 26 Z" fill="#F0C059"/>

    <!-- Fresh Raspberries -->
    <circle cx="-15" cy="-15" r="14" fill="#C72C41"/>
    <circle cx="12" cy="-22" r="15" fill="#9E1B32"/>
    <circle cx="0" cy="-5" r="16" fill="#D9384E"/>
  </g>

  <!-- Studio Identity Label Badge -->
  <g transform="translate(300, 545)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(43,26,20,0.88)" stroke="#F0C059" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#E2D6EB" text-anchor="middle" letter-spacing="1.8">LAVENDER MIST ATELIER</text>
  </g>
</svg>

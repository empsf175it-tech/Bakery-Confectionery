<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">
  <defs>
    <linearGradient id="fullBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0B359" />
      <stop offset="52%" stop-color="#C98B4B" />
      <stop offset="100%" stop-color="#9B5D22" />
    </linearGradient>
    <linearGradient id="fullMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF2DC" />
    </linearGradient>
    <linearGradient id="fullMarkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0A3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2B1A14" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="44" height="44" rx="13" fill="url(#fullBgGradient)" filter="url(#iconShadow)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    
    <!-- Inner Vector Mark scaled to 26px inside 44px box -->
    <g transform="translate(9, 9) scale(0.8125)">
      <path d="M5.5 23.5H26.5" stroke="url(#fullMarkGrad)" stroke-width="1.6" stroke-linecap="round" />
      <path d="M7 23.5C7 14.5 10.8 8.5 16 8.5C21.2 8.5 25 14.5 25 23.5" stroke="url(#fullMarkGrad)" stroke-width="1.6" stroke-linecap="round" />
      <path d="M16 9V20.5" stroke="url(#fullMarkGrad)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M16 9C12.8 9 10.8 12.8 10.8 16.5C10.8 19.2 13 21 16 21.8" stroke="url(#fullMarkGrad)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M16 9C19.2 9 21.2 12.8 21.2 16.5C21.2 19.2 19 21 16 21.8" stroke="url(#fullMarkGrad)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M16 11.5C14.2 11.5 13.2 13.8 13.2 16.2C13.2 18 14.4 19.2 16 19.8" stroke="url(#fullMarkGrad)" stroke-width="1.3" stroke-linecap="round" />
      <path d="M16 11.5C17.8 11.5 18.8 13.8 18.8 16.2C18.8 18 17.6 19.2 16 19.8" stroke="url(#fullMarkGrad)" stroke-width="1.3" stroke-linecap="round" />
      <path d="M13.5 22.8H18.5" stroke="url(#fullMarkGrad)" stroke-width="1.8" stroke-linecap="round" />
      <path d="M16 22.8V25.2" stroke="url(#fullMarkGrad)" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="16" cy="26" r="1.1" fill="url(#fullMarkGrad)" />
      <path d="M16 2.2L16.8 4.4L19 5.2L16.8 6L16 8.2L15.2 6L13 5.2L15.2 4.4Z" fill="url(#fullMarkAccent)" />
      <circle cx="8.5" cy="11.5" r="0.9" fill="url(#fullMarkAccent)" opacity="0.85" />
      <circle cx="23.5" cy="11.5" r="0.9" fill="url(#fullMarkAccent)" opacity="0.85" />
    </g>
  </g>

  <!-- Typography: BakeStudio Haute Patisserie -->
  <text x="60" y="30" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="#2B1A14" letter-spacing="-0.5">Bake<tspan fill="#C98B4B">Studio</tspan></text>
  <text x="60.5" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#C98B4B" letter-spacing="2.4">HAUTE PÂTISSERIE</text>
</svg>

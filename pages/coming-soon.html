<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | BakeStudio Baking Academy & Masterclasses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Favicon & Brand Icon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/logo-mark.svg">
  <link rel="apple-touch-icon" href="../assets/images/logo/logo-mark.svg">

  <!-- Dedicated View Stylesheets (Separate files for Base, Desktop >=1024px, Tablet 640-1023px, and Mobile <640px) -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/desktop.css">
  <link rel="stylesheet" href="../assets/css/tablet.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .cs-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      background: radial-gradient(circle at 50% 20%, rgba(201, 139, 75, 0.18) 0%, rgba(255, 246, 232, 0) 70%), var(--bg-primary);
    }
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin: 36px 0;
      max-width: 580px;
      width: 100%;
    }
    .countdown-card {
      background: #FFFFFF;
      border: 1px solid var(--border-caramel);
      border-radius: var(--radius-md);
      padding: 20px 10px;
      box-shadow: var(--shadow-sm);
    }
    .countdown-num {
      font-family: var(--font-serif);
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--caramel-gold);
      line-height: 1;
    }
    .countdown-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="cs-wrapper">
    <div class="section-pill">Culinary Academy & Workshop Studio</div>
    <h1 style="font-size: clamp(2.4rem, 5vw, 3.8rem); margin-bottom: 16px; color: var(--cocoa-deep);">
      Slow-Proofing Something <span>Decadent</span>
    </h1>
    <p style="font-size: 1.15rem; color: var(--text-secondary); max-width: 600px; margin-bottom: 24px;">
      Our master pastry academy and immersive in-person masterclasses are currently being prepped for public enrollment.
    </p>

    <!-- Countdown Timer -->
    <div class="countdown-grid">
      <div class="countdown-card">
        <div class="countdown-num" id="cdDays">18</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-card">
        <div class="countdown-num" id="cdHours">07</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-card">
        <div class="countdown-num" id="cdMinutes">42</div>
        <div class="countdown-label">Minutes</div>
      </div>
      <div class="countdown-card">
        <div class="countdown-num" id="cdSeconds">19</div>
        <div class="countdown-label">Seconds</div>
      </div>
    </div>

    <!-- Notify Form -->
    <form style="display: flex; gap: 10px; max-width: 500px; width: 100%; margin-bottom: 24px;" onsubmit="event.preventDefault(); alert('You are on the VIP guest list! We will notify you upon launch.'); this.reset();">
      <input type="email" class="form-input" placeholder="Enter your email address..." required style="border-radius: var(--radius-full);">
      <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Notify Me</button>
    </form>

    <div>
      <a href="../index.html" class="btn btn-outline">← Back to Main Studio</a>
    </div>
  </div>

  <script>
    // Live countdown simulation
    let seconds = 19;
    let minutes = 42;
    let hours = 7;
    let days = 18;

    setInterval(() => {
      seconds--;
      if (seconds < 0) {
        seconds = 59;
        minutes--;
        if (minutes < 0) {
          minutes = 59;
          hours--;
        }
      }
      document.getElementById('cdSeconds').textContent = seconds < 10 ? '0' + seconds : seconds;
      document.getElementById('cdMinutes').textContent = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('cdHours').textContent = hours < 10 ? '0' + hours : hours;
      document.getElementById('cdDays').textContent = days;
    }, 1000);
  </script>
</body>
</html>
